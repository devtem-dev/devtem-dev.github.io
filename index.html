<style>
  /* Template switcher: follows the active theme tokens */
  .template-switcher {
    position: fixed; bottom: 16px; left: 16px; z-index: 95;
    max-width: calc(100vw - 92px);
    display: flex; align-items: center; gap: 4px; padding: 6px 10px;
    border-radius: 60px; border: 1px solid var(--glass-border);
    background: var(--nav-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    font-family: monospace; overflow-x: auto; scrollbar-width: none;
  }
  .template-switcher::-webkit-scrollbar { display: none; }
  .template-switcher .ico { color: var(--muted); margin: 0 6px 0 2px; flex: none; }
  .template-btn {
    flex: none; padding: 6px 12px; border-radius: 40px;
    color: var(--muted); font-family: monospace; font-size: 0.7rem; letter-spacing: 0.05em;
    transition: background 0.2s, color 0.2s;
  }
  .template-btn:hover { background: var(--surface); color: var(--text); }
  .template-btn.active { background: var(--accent); color: var(--bg-deep); font-weight: 700; }

  .toast-notification {
    position: fixed; bottom: 72px; left: 16px; z-index: 9999;
    background: var(--accent); color: var(--bg-deep);
    padding: 10px 20px; border-radius: 40px; font: 600 0.8rem monospace;
    opacity: 0; transform: translateY(20px); transition: all 0.3s ease; pointer-events: none;
  }
  .toast-notification.show { opacity: 1; transform: none; }

  @media (max-width: 680px) {
    .template-switcher { bottom: 14px; left: 14px; padding: 4px 8px; }
    .template-btn { padding: 5px 10px; font-size: 0.62rem; }
    .toast-notification { bottom: 64px; left: 14px; }
  }
</style>
</head>
<body>

<div id="app-root"></div>

<div class="template-switcher" id="template-switcher" role="group" aria-label="Template switcher">
  <span class="ico" aria-hidden="true"><i class="fas fa-palette"></i></span>
</div>
<div id="toast" class="toast-notification" role="status" aria-live="polite">✓ Copied to clipboard</div>

<script>
const CDN_CSS = '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/devtemdesign@0.1.0/style.min.css">';
const CDN_JS  = '<script src="https://cdn.jsdelivr.net/npm/devtemdesign@0.1.0/script.min.js"><\/script>';

const config = {
  template: "cyber",
  logo: "https://fscss.devtem.org/assets/images/fscss.png",
  logoName: "DEVTEM",
  navLinks: [
    { label: "Docs",        href: "/docs" },
    { label: "Sandbox",     href: "/sandbox" },
    { label: "Schema API",  href: "/api" },
    { label: "npm Package", href: "https://www.npmjs.com/package/devtemdesign" },
    { label: "Templates",   href: "https://devtem.org/home?q=@devtemDesign" }
  ],
  ctaText: "CDN",

  heroBadge: "Core Framework // devtemdesign@0.1.0",
  heroTitleLine1: "Declarative UI,",
  heroTitleLine2: "Zero-Config Motion",
  heroSubtitle: "One configuration schema. Infinite animated synthesis. Stop building standard UI boilerplate. Let the engine paint the viewport.",
  primaryBtnText: "Try Without Code",
  primaryBtnHref: "/builder",
  secondaryBtnText: "Copy CDN",
  secondaryBtnHref: "#",

  brands: ["NPM", "FSCSS", "DEVTEMPLE", "ESBUILD", "CSS3", "HTML5", "WEBGL"],
  brandsSubtitle: "Engine Architecture Utilities & Dependencies",

  featuresLabel: "<i class='fas fa-code-branch'></i> CORE ENGINE MECHANICS",
  featuresTitle: "Pass raw structural data. The canvas resolves itself dynamically.",
  features: [
    {
      title: "Deterministic Engine Schema",
      desc: "Strict object parsing transforms simple titles, tags, and matrices into hardware-accelerated layouts without HTML creation workflows.",
      icon: "<i class='fas fa-cube'></i>"
    },
    {
      title: "Ambient Micro-Interactions",
      desc: "Integrated magnet-ring cursor, click ripples, card spotlight, and scroll reveal ship bundled out of the box.",
      icon: "<i class='fas fa-magic'></i>"
    },
    {
      title: "Adaptive Theme Synthesis",
      desc: "Switch between 7 templates at runtime. The engine morphs tokens across glass layers, backdrops, and neon accents.",
      icon: "<i class='fas fa-palette'></i>"
    }
  ],

  panels: [
    {
      tag: "FRAMEWORK API",
      title: "devtemDesign(container, config)",
      desc: "The entire UI initialized through a single handler. It returns setTemplate() and destroy() for runtime control."
    },
    {
      tag: "PERFORMANCE LAYER",
      title: "Passive Inertia Transforms",
      desc: "No bulky execution bundles. Native Intersection Observers decouple scrolling routines from render cycles."
    }
  ],

  footer: {
    tagline: "Declarative UI engine for the modern web. Zero config. Full motion.",
    columns: [
      { heading: "Product", links: [
        { label: "Documentation", href: "/docs" },
        { label: "Sandbox",       href: "/sandbox" },
        { label: "Schema API",    href: "/api" },
        { label: "Changelog",     href: "https://github.com/devtem-dev/devtemDesign" }
      ]},
      { heading: "Resources", links: [
        { label: "npm Package",  href: "https://www.npmjs.com/package/devtemdesign" },
        { label: "GitHub",       href: "https://github.com/devtem-dev" },
        { label: "DevTemple",    href: "https://devtem.org/home?q=@devtemDesign" },
        { label: "FSCSS Engine", href: "https://fscss.devtem.org" }
      ]},
      { heading: "Company", links: [
        { label: "About DevTemple", href: "https://devtem.org" },
        { label: "Templates",       href: "https://devtem.org/home?q=@devtemDesign" },
        { label: "Subscribe",       href: "https://devtem.org/s?s=@devtemDesign" }
      ]}
    ],
    social: [
      { icon: "fab fa-github",  href: "https://github.com/devtem-dev/devtemDesign", label: "GitHub" },
      { icon: "fab fa-twitter", href: "https://twitter.com/fscss_ttr", label: "Twitter" },
      { icon: "fab fa-npm",     href: "https://npmjs.com/package/devtemdesign", label: "npm" },
      { icon: "fab fa-dev",     href: "https://dev.to/fscss", label: "DEV" }
    ],
    legal: [
      { label: "Privacy Policy", href: "/privacy" },
      { label: "Terms of Use",   href: "/terms" },
      { label: "License (MIT)",  href: "/license" }
    ],
    copy: `© ${new Date().getFullYear()} Figsh / DevTemple · devtemDesign is open source`
  }
};

/* ---------- render once; theme changes use setTemplate (no re-render) ---------- */
const page = devtemDesign("app-root", config);

/* ---------- template switcher, built from the engine's own list ---------- */
const bar = document.getElementById("template-switcher");
const LABELS = { monochrome: "MONO" };
devtemDesign.templates.forEach(name => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "template-btn" + (name === config.template ? " active" : "");
  b.dataset.template = name;
  b.textContent = LABELS[name] || name.toUpperCase();
  bar.appendChild(b);
});
bar.addEventListener("click", e => {
  const b = e.target.closest(".template-btn");
  if (!b) return;
  page.setTemplate(b.dataset.template);
  bar.querySelectorAll(".template-btn").forEach(x => x.classList.toggle("active", x === b));
});

/* ---------- copy CDN (delegated, so it survives any re-render) ---------- */
const toast = document.getElementById("toast");
let toastTimer;
document.addEventListener("click", async e => {
  const a = e.target.closest(".hero-actions .btn-ghost, .nav-cta");
  if (!a) return;
  e.preventDefault();

  const text = a.classList.contains("nav-cta") ? CDN_JS : CDN_CSS + "\n" + CDN_JS;
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    toast.textContent = "Copy failed. Select the text manually.";
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    return;
  }

  toast.textContent = "✓ Copied to clipboard";
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);

  if (!a.dataset.orig) a.dataset.orig = a.innerHTML;
  a.textContent = "✓ Copied!";
  setTimeout(() => { a.innerHTML = a.dataset.orig; delete a.dataset.orig; }, 1500);
});
</script>
</body>
