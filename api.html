const TPL = [["figsh","Futuristic glass","#7af4ff #b77cff #ff7096"],["cyber","Neon cyberpunk","#00f0ff #ff2bd6 #ff3366"],["aurora","Organic nature","#48bb78 #8b5cf6 #3b82f6"],["monochrome","Minimal grayscale","#ffffff #b0b0b0 #7a7a7a"],["sunset","Warm dusk","#ff9a5a #ff5c8a #ffd166"],["ocean","Cool depth","#38bdf8 #2dd4bf #818cf8"],["paper","Light mode","#4f46e5 #db2777 #0891b2"]];

/* ---------- renderers ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const hl = s => esc(s).replace(/(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'[^'\n]*')|\b(devtemDesign|setTemplate)\b|\b([A-Za-z_][\w-]*)(?=\s*:)/g,
  (m,c,st,fn,k) => c ? `<span class="cm">${c}</span>` : st ? `<span class="str">${st}</span>` : fn ? `<span class="fn">${fn}</span>` : `<span class="kw">${k}</span>`);

function table(head, rows) {
  return `<div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="t">${esc(r[1])}</td><td class="d">${esc(r[2])}</td><td>${md(r[3])}</td></tr>`).join("")}</tbody></table></div>`;
}
function sec(s) {
  let h = `<section class="sec" id="${s.id}"><h2><span class="ic"><i class="fas fa-${s.ic}"></i></span>${s.t}</h2><p class="intro">${md(s.intro)}</p>`;
  if (s.swatches) h += `<div class="sw">${TPL.map(t=>`<button class="swatch" type="button" data-t="${t[0]}"><div class="dots">${t[2].split(" ").map(c=>`<b style="background:${c}"></b>`).join("")}</div><strong style="color:${t[2].split(" ")[0]}">"${t[0]}"</strong><span>${t[1]}</span></button>`).join("")}</div>`;
  if (s.rows) h += table(s.head || H, s.rows);
  if (s.code) h += `<div class="code"><span class="lb">${s.code[0]}</span><button class="cp" type="button">copy</button><pre><code>${hl(s.code[1])}</code></pre></div>`;
  if (s.note) h += `<div class="call ${s.note[0]==="warn"?"warn":""}"><i class="fas fa-${s.note[0]==="warn"?"triangle-exclamation":"circle-info"}"></i><div>${md(s.note[1])}</div></div>`;
  return h + "</section>";
}

const side = groups.map(g => `<h4>${g[0]}</h4>` + g[1].map(id => { const s = S.find(x=>x.id===id); return `<a href="#${id}"><i class="fas fa-${s.ic}"></i>${s.t}</a>`; }).join("")).join("");

el.className = "api-page";
el.innerHTML = `
<header class="api-header"><div class="api-header-inner">
  <div class="eyebrow"><i class="fas fa-code"></i> Reference</div>
  <h1>Schema <em>API</em></h1>
  <p class="lede">Complete configuration reference for <code>devtemDesign()</code>. One function call, one config object. Everything else is handled by the engine.</p>
  <div class="badges"><span class="badge on"><i class="fas fa-tag"></i> v0.1.0</span><span class="badge"><i class="fab fa-npm"></i> devtemdesign</span><span class="badge"><i class="fas fa-circle" style="color:#22c55e;font-size:.5rem"></i> Stable</span><a class="badge" href="/docs">Docs</a><a class="badge" href="/examples">Examples</a></div>
</div></header>
<div class="api-body"><nav class="side" aria-label="Schema sections">${side}</nav><main class="content">${S.map(sec).join("")}</main></div>`;
document.querySelector(".site-footer").before(el);

/* ---------- interactions ---------- */
el.addEventListener("click", e => {
  const sw = e.target.closest(".swatch");
  if (sw) { page.setTemplate(sw.dataset.t); return; }
  const b = e.target.closest(".cp");
  if (b) navigator.clipboard.writeText(b.parentNode.querySelector("pre").textContent).then(
    () => { b.textContent = "copied!"; setTimeout(() => b.textContent = "copy", 1600); },
    () => { b.textContent = "failed"; setTimeout(() => b.textContent = "copy", 1600); });
});

const links = {};
el.querySelectorAll(".side a").forEach(a => links[a.hash.slice(1)] = a);
const io = new IntersectionObserver(es => es.forEach(en => {
  if (!en.isIntersecting) return;
  Object.values(links).forEach(l => l.classList.remove("active"));
  const a = links[en.target.id]; if (!a) return;
  a.classList.add("active");
  a.scrollIntoView({ block: "nearest", inline: "nearest" });
}), { rootMargin: "-25% 0px -65% 0px" });
el.querySelectorAll(".sec").forEach(s => io.observe(s));
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
